<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قنارة</title>
<meta name="color-scheme" content="light">
<meta property="og:title" content="حمّل تطبيق قنارة">
<meta property="og:description" content="حمّل التطبيق من App Store أو Google Play">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --teal: #1b4a45;
    --teal-deep: #123833;
    --sage: #8a9a86;
    --cream: #e2dbc8;
    --paper: #f1ecdd;
    --muted: #5d6f68;
    --font: "Tajawal", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    color: var(--teal);
    background:
      radial-gradient(circle at 85% 8%, rgba(226,219,200,.16) 0, transparent 40%),
      radial-gradient(circle at 10% 95%, rgba(138,154,134,.35) 0, transparent 50%),
      var(--teal-deep);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px max(16px, env(safe-area-inset-right, 0px)) 28px max(16px, env(safe-area-inset-left, 0px));
  }
  .card {
    position: relative;
    width: 100%;
    max-width: 420px;
    min-width: 0;
    background: var(--cream);
    border-radius: 28px;
    padding: 34px 26px 28px;
    text-align: center;
    box-shadow: 0 24px 60px rgba(0,0,0,.35);
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 12px;
    border: 2px solid var(--teal);
    border-radius: 18px;
    pointer-events: none;
    opacity: .9;
  }
  .logo { display: block; width: 190px; max-width: 70%; height: auto; margin: 10px auto 22px; }
  h1 {
    font-size: clamp(20px, 6vw, 26px);
    font-weight: 800;
    line-height: 1.6;
    color: var(--teal);
    margin-bottom: 4px;
  }
  h1 span { display: block; white-space: nowrap; }
  .sub { font-size: 17px; font-weight: 500; color: var(--muted); margin-bottom: 26px; }
  .tag {
    display: inline-block;
    background: var(--sage);
    color: var(--teal-deep);
    font-weight: 700;
    font-size: 14px;
    padding: 4px 14px;
    border-radius: 6px;
    margin-bottom: 24px;
  }
  .stores { display: flex; flex-direction: column; gap: 14px; padding: 0 6px 8px; }
  .store {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: var(--teal);
    color: var(--paper);
    text-decoration: none;
    padding: 12px 22px;
    border-radius: 16px;
    text-align: right;
    box-shadow: 0 6px 14px rgba(18,56,51,.28);
    transition: transform .2s, background .2s, box-shadow .2s;
  }
  .store:hover { background: var(--teal-deep); transform: translateY(-2px); box-shadow: 0 10px 20px rgba(18,56,51,.35); }
  .store:active { transform: scale(.98); }
  .store:focus-visible { outline: 3px solid var(--sage); outline-offset: 3px; }
  .store svg { width: 32px; height: 32px; flex-shrink: 0; }
  .store small { display: block; font-size: 12px; opacity: .85; font-weight: 400; }
  .store strong { display: block; font-size: 19px; font-weight: 700; line-height: 1.2; direction: ltr; text-align: right; }
  .foot { margin-top: 20px; font-size: 14px; color: var(--muted); font-weight: 500; }
  @media (prefers-reduced-motion: reduce) { .store { transition: none; } }
</style>
</head>
